# KeeMan with containers: API server, web client and Caddy in front with
# automatic TLS. Build the images first, from their repositories:
#   podman build -t keeman-server .        (server repository)
#   podman build -t keeman-webclient .     (web client repository)
# Replace the example hosts here and in Caddyfile, then (see README,
# "Containers"):
#   podman compose run --rm api init --config /etc/keeman/config.toml --data-dir /var/lib/keeman
#   podman compose up -d
#   podman compose exec api keeman-server invite create --config /etc/keeman/config.toml
# Works the same with docker compose.

services:
  api:
    image: keeman-server:latest
    restart: unless-stopped
    environment:
      # Installation-specific values; they override the placeholders init
      # writes into config.toml.
      KEEMAN__SERVER__LISTEN: "0.0.0.0:8787"
      KEEMAN__SERVER__PUBLIC_API_URL: "https://api.example.org"
      KEEMAN__SERVER__ALLOWED_ORIGINS: '["https://app.example.org"]'
      KEEMAN__WEBAUTHN__RP_ID: "app.example.org"
      KEEMAN__WEBAUTHN__RP_ORIGINS: '["https://app.example.org"]'
      # Only the proxy's fixed address may set the client IP
      # (X-Forwarded-For); any other container in the network could
      # otherwise fake it and get around the rate limits per IP.
      KEEMAN__SERVER__TRUSTED_PROXIES: '["172.31.240.10/32"]'
    volumes:
      - config:/etc/keeman
      - data:/var/lib/keeman
      - backups:/var/backups/keeman
    networks:
      - keeman

  web:
    image: keeman-webclient:latest
    restart: unless-stopped
    environment:
      KEEMAN_API_HOST: "api.example.org"
    networks:
      - keeman

  proxy:
    image: docker.io/library/caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web
    networks:
      keeman:
        ipv4_address: 172.31.240.10

# A fixed subnet, so the proxy keeps the address the API trusts. Pick
# another one if it collides with a network on the host.
networks:
  keeman:
    ipam:
      config:
        - subnet: 172.31.240.0/24

volumes:
  config:
  data:
  backups:
  caddy-data:
  caddy-config:
