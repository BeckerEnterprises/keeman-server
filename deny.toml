# cargo-deny configuration (run via `make check`).

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only, all compatible with the project's AGPL-3.0-or-later.
allow = [
  "MIT",
  # webauthn-rs and its crates; file-level copyleft, compatible with AGPL-3.0.
  "MPL-2.0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93
# The allowlist is policy for future dependencies, so unused entries are fine.
unused-allowed-license = "allow"
# Only dependencies are checked; the unpublished server crate itself is AGPL-3.0-or-later.
private = { ignore = true }
# Mozilla's root certificates as data, used by rustls-platform-verifier only on
# platforms without a system store (not on Linux); a permissive data licence.
exceptions = [
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
